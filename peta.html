        .navbar-container {

        .logo {

            gap: 8px;

        }
        
        .logo-icon {

            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .nav-links {
            display: flex;
            gap: 32px;
        }
        
        .nav-link {
            text-decoration: none;
            color: var(--primary-dark);
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-link:hover {
            color: var(--primary);
        }
        
        .nav-link.active {
            color: var(--primary);
        }
        
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary);
            border-radius: 2px;

            gap: 16px;
            align-items: center;

            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .register-btn:hover {

            transform: translateY(-2px);

            text-align: center;
            margin-bottom: 32px;

            color: var(--primary-dark);
            margin-bottom: 8px;

            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;

            grid-template-columns: 280px 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 24px;
            height: fit-content;
            border-top: 4px solid var(--primary);

            font-weight: 600;
            margin-bottom: 24px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 24px;
        }
        
        .filter-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 0.95rem;

            color: #444;

            border-color: var(--primary);

        }

            justify-content: space-between;

            font-family: 'Poppins', sans-serif;

        // Array untuk menyimpan marker dan circle yang ditampilkan
        let circles = [];
        let centerMarkers = [];
        
        // Fungsi untuk mendapatkan radius untuk suatu item
        function getItemRadius(item) {
            // Jika item memiliki radius khusus, gunakan itu
            if (item.radius) {
                return item.radius;
            }
            
            // Default radius berdasarkan jenis dagangan
            switch (item.jenisDagangan) {
                case "makanan":
                    return 120;
                case "pakaian":
                    return 150;
                case "jasa":
                    return 180;
                default:
                    return FIXED_RADIUS;
            }
        }
        
        // Fungsi untuk menampilkan marker berdasarkan filter
        function displayMarkers(jenisDagangan, jamJualan) {
            // Hapus semua circle dan marker yang sudah ada di peta
            circles.forEach(circle => {
                map.removeLayer(circle);
            });
            centerMarkers.forEach(marker => {
                map.removeLayer(marker);
            });
            circles = [];
            centerMarkers = [];
            
            // Filter data marker berdasarkan kriteria yang dipilih
            const filteredData = pedagangData.filter(item => {
                const jenisMatch = jenisDagangan === 'semua' || item.jenisDagangan === jenisDagangan;
                const jamMatch = jamJualan === 'semua' || item.jamJualan === jamJualan;
                return jenisMatch && jamMatch;
            });
            
            // Tambahkan circle dan marker yang sesuai filter ke peta
            filteredData.forEach(item => {
                let circleColor;
                let fillOpacity = 0.3;
                
                switch (item.warna) {
                    case 'green':
                        circleColor = '#2a9d8f';
                        break;
                    case 'red':
                        circleColor = '#e76f51';
                        break;
                    case 'yellow':
                        circleColor = '#e9c46a';
                        break;
                    default:
                        circleColor = '#264653';
                }
                
                // Dapatkan radius untuk item ini
                const radius = getItemRadius(item);
                
                // Buat circle dengan radius yang ditentukan
                const circle = L.circle(item.koordinat, {
                    color: circleColor,
                    fillColor: circleColor,
                    fillOpacity: fillOpacity,
                    radius: radius,
                    weight: 1
                });
                
                // Buat marker kecil di tengah circle
                const centerMarker = L.circleMarker(item.koordinat, {
                    radius: 4,
                    color: circleColor,
                    fillColor: circleColor,
                    fillOpacity: 1,
                    weight: 1
                });
                
                const popupContent = `
                    <div class="popup-content">
                        <h3 class="popup-title">${item.nama}</h3>
                        <div class="popup-detail">
                            <span class="popup-label">Jenis:</span>
                            <span class="popup-value">${item.jenisDagangan}</span>
                        </div>
                        <div class="popup-detail">
                            <span class="popup-label">Jam:</span>
                            <span class="popup-value">${item.jamJualan}</span>
                        </div>
                        <div class="popup-description">${item.deskripsi}</div>
                        <div class="popup-detail" style="margin-top: 8px;">
                            <span class="popup-label">Radius Area:</span>
                            <span class="popup-value">${radius} meter</span>
                        </div>
                    </div>
                `;
                
                circle.bindPopup(popupContent);
                centerMarker.bindPopup(popupContent);
                
                circle.addTo(map);
                centerMarker.addTo(map);
                
                circles.push(circle);
                centerMarkers.push(centerMarker);
            });
        }
        
        // Event listener untuk dropdown jenis dagangan
        document.getElementById('jenisDagangan').addEventListener('change', function() {
            const jenisDagangan = this.value;
            const jamJualan = document.getElementById('jamJualan').value;
            displayMarkers(jenisDagangan, jamJualan);
        });
        
        // Event listener untuk dropdown jam jualan
        document.getElementById('jamJualan').addEventListener('change', function() {
            const jenisDagangan = document.getElementById('jenisDagangan').value;
            const jamJualan = this.value;
            displayMarkers(jenisDagangan, jamJualan);
        });
        
        // Event listener untuk tombol reset
        document.getElementById('resetFilters').addEventListener('click', function() {
            document.getElementById('jenisDagangan').value = 'semua';
            document.getElementById('jamJualan').value = 'semua';
            displayMarkers('semua', 'semua');
        });
        
        // Event listener untuk tombol apply filter
        document.getElementById('applyFilters').addEventListener('click', function() {
            const jenisDagangan = document.getElementById('jenisDagangan').value;
            const jamJualan = document.getElementById('jamJualan').value;
            displayMarkers(jenisDagangan, jamJualan);
        });
        
        // Tampilkan semua marker saat halaman dimuat
        displayMarkers('semua', 'semua');
    </script>
